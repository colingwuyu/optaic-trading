name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.14"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy libs apps optaic --ignore-missing-imports

      - name: Run unit tests
        run: uv run pytest libs/ apps/ optaic/ -q --tb=short

      - name: Run integration tests
        run: uv run pytest tests/integration/ -q --tb=short
        env:
          OPTAIC_TEST_SANDBOX_DIR: ${{ runner.temp }}/optaic-sandbox
