services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
      LOG_LEVEL: INFO
      CENTRIFUGO_HMAC_SECRET: dev-secret-change-me
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: attachments
      S3_REGION: us-east-1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
      LOG_LEVEL: INFO
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: dev-api-key
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: attachments
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: local
      LOG_LEVEL: INFO
      AGENT_API_BASE_URL: http://api:8000
      AGENT_POLL_INTERVAL: 2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: attachments
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: attachments
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY
        mc mb --ignore-existing local/$$S3_BUCKET
        mc anonymous set none local/$$S3_BUCKET

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    volumes:
      - ./centrifugo:/centrifugo:ro
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app/apps/web
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_CENTRIFUGO_URL: ws://localhost:8001/connection/websocket
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ..:/app
      - web-node-modules:/app/apps/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  web-node-modules:
