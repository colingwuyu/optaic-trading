[project]
name = "optaic"
version = "0.1.0"
description = "A platform for resource management and activity tracking."
authors = [{ name = "Author", email = "author@example.com" }]
requires-python = ">=3.11"

# Minimal core dependencies (required for any install)
dependencies = [
    "pydantic-settings>=2.1.0",
    "platformdirs>=4.2.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "packaging>=24.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# SDK-only (lightweight client)
# Note: Recursive extras (optaic[xxx]) are supported by setuptools>=61 and pip>=21.3
sdk = [
    "pydantic>=2.0.0",
    "httpx>=0.26.0",
    "typing-extensions>=4.9.0",
]

# Alias for sdk
client = [
    "pydantic>=2.0.0",
    "httpx>=0.26.0",
    "typing-extensions>=4.9.0",
]

# Server (API + DB, no engines)
server = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pycasbin>=1.36.0",
    "python-multipart>=0.0.20",
]

# Realtime (Centrifugo token signing)
realtime = [
    "PyJWT>=2.8.0",
    "websockets>=12.0",
]

# Prefect orchestration (local server)
prefect = [
    "prefect>=3.0.0,<4",
]

# MLflow tracking (local server)
mlflow = [
    "mlflow>=2.12.0,<3",
]

# Redis client (python-side helpers, not server)
redis = [
    "redis>=5.0.1,<6",
]

# S3/cloud storage
storage = [
    "boto3>=1.34.0",
]

# Monitoring/data quality
monitoring = [
    "pandera>=0.18.0",
]

# Data validation guardrails
guardrails = [
    "pydantic>=2",
    "jsonschema>=4.20.0",
]

# Guardrails development/testing
guardrails-dev = [
    "pytest",
    "ruff",
]

# Engines only (Prefect + MLflow)
engines = [
    "prefect>=3.0.0,<4",
    "mlflow>=2.12.0,<3",
]

# Full local stack (all engines)
all = [
    # server deps
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pycasbin>=1.36.0",
    # realtime deps
    "PyJWT>=2.8.0",
    "websockets>=12.0",
    # engines
    "prefect>=3.0.0,<4",
    "mlflow>=2.12.0,<3",
    # redis
    "redis>=5.0.1,<6",
    # storage
    "boto3>=1.34.0",
]

# Alias for all
full = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pycasbin>=1.36.0",
    "PyJWT>=2.8.0",
    "websockets>=12.0",
    "prefect>=3.0.0,<4",
    "mlflow>=2.12.0,<3",
    "redis>=5.0.1,<6",
    "boto3>=1.34.0",
]

# Development dependencies
dev = [
    # all deps (expanded)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pycasbin>=1.36.0",
    "PyJWT>=2.8.0",
    "websockets>=12.0",
    "prefect>=3.0.0,<4",
    "mlflow>=2.12.0,<3",
    "redis>=5.0.1,<6",
    "boto3>=1.34.0",
    # data libraries (needed for libs/data tests)
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    # dev tools
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-json-report>=1.5.0",
    "build>=1.2.1",
    "moto>=5.0.0",
    "ruff>=0.2.1",
    "twine>=5.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.1",
]


[project.scripts]
optaic = "optaic.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["optaic*", "apps*", "libs*"]
exclude = ["**/__pycache__", "**/__pycache__/**"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
optaic = ["infra/versions.json", "webui_dist/**/*", "webui_dist/.buildinfo.json"]
"libs.db" = ["alembic.ini", "migrations/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.uv]
workspace = { members = ["apps/api", "apps/agent", "apps/worker", "libs/core", "libs/db", "libs/sdk_py"] }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "apps", "optaic", "tests"]
filterwarnings = [
    # MLflow has known Pydantic/protobuf deprecation issues (tracked in mlflow/mlflow#11203, #12654, #13018)
    # These are third-party issues that cannot be fixed by updating package versions.
    # MLflow team will fix when they drop Pydantic 1.x support.
    "ignore:Using `@model_validator` with mode='after' on a classmethod is deprecated:DeprecationWarning:mlflow",
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:mlflow",
    "ignore:label\\(\\) is deprecated:DeprecationWarning:mlflow",
]
markers = [
    "integration: marks tests as integration tests (tests against real infrastructure)",
]

[dependency-groups]
dev = [
    "passlib>=1.7.4",
    "pypiserver>=2.4.0",
]
