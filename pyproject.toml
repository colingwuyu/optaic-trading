[project]
name = "optaic"
version = "0.1.0"
description = "A platform for resource management and activity tracking."
authors = [{ name = "Author", email = "author@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "redis>=5.0.1",
    "pydantic-settings>=2.1.0",
    "platformdirs>=4.2.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "httpx>=0.26.0",
    "prefect>=3.0.0,<4",
    "mlflow>=2.12.0,<3",
    "PyJWT>=2.8.0",
    "pycasbin>=1.36.0",
    "boto3>=1.34.0",
    "packaging>=24.0",
]

[project.scripts]
optaic = "optaic.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["optaic*", "apps*", "libs*"]
exclude = ["**/__pycache__", "**/__pycache__/**"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
optaic = ["infra/versions.json", "webui_dist/**/*", "webui_dist/.buildinfo.json"]
"libs.db" = ["alembic.ini", "migrations/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.uv]
workspace = { members = ["apps/api", "apps/agent", "apps/worker", "libs/core", "libs/db", "libs/sdk_py"] }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "apps", "optaic"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "build>=1.2.1",
    "moto>=5.0.0",
    "ruff>=0.2.1",
    "twine>=5.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.1",
]
